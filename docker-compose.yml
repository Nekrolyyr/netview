# netview behind Traefik at https://netview.vault.akiba-z.ch (Let's Encrypt certificate).
# Settings come from .env (copy .env.example).
services:
  netview:
    build: .
    image: netview:latest
    restart: unless-stopped
    ports:
      - 5173:80
    environment:
      # file name inside NETVIEW_DATA_DIR that the app opens on start
      NETVIEW_DATASET_FILE: ${NETVIEW_DATASET_FILE:-network.netview}
    volumes:
      # local directory with the bundle(s), e.g. har-analyzer's data/export/viewer
      - ${NETVIEW_DATA_DIR:-./data}:/data:ro
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.netview.rule=Host(`netview.vault.akiba-z.ch`)
      - traefik.http.routers.netview.entrypoints=websecure
      - traefik.http.routers.netview.tls.certresolver=le
      # port inside the container (nginx), not the host port 5173
      - traefik.http.services.netview.loadbalancer.server.port=80
networks:
  traefik:
    external: true
